<!doctype html>
<html><head><meta charset="utf-8"><title>test</title></head>
<body>
<pre id="out">running…</pre>
<iframe id="f" src="about:blank" style="width:390px;height:844px;border:1px solid #ccc"></iframe>
<script type="module">
import * as store from '../js/store.js';

const out = document.getElementById('out');
const log = [];
let failures = 0;
const p = (s) => { log.push(s); out.textContent = log.join('\n'); };
const ok  = (cond, name, detail = '') => { if (!cond) failures++; p(`${cond ? 'PASS' : 'FAIL'}  ${name}${detail ? '  — ' + detail : ''}`); };
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

/* Wait for a condition rather than a duration — a fixed sleep is a test that
   lies on a slow machine. */
async function until(fn, ms = 8000) {
  const stop = Date.now() + ms;
  while (Date.now() < stop) {
    try { if (fn()) return true; } catch { /* not ready */ }
    await wait(40);
  }
  return false;
}

/* The iframe has its own instance of store.js with its own in-memory array.
   Re-read from localStorage before asserting on it. */
const S = () => { store.load(); return store; };

const f = document.getElementById('f');
const load = (url) => new Promise((res) => { f.onload = () => res(f.contentWindow); f.src = url; });
const $ = (sel) => f.contentDocument.querySelector(sel);
const $$ = (sel) => [...f.contentDocument.querySelectorAll(sel)];
/* Second argument reads a pseudo-element — '::selection' and friends. */
const cs = (n, pseudo = null) => f.contentWindow.getComputedStyle(n, pseudo);
const type = (node, value) => {
  node.value = value;
  node.dispatchEvent(new f.contentWindow.InputEvent('input', { bubbles: true }));
};

async function run() {
  localStorage.removeItem('digijournal.v1');
  sessionStorage.clear();

  /* ---------------------------------------------------------- 1. the launch
     Nothing stands between the icon and the journal. There is no gate, and
     nothing on the way in asks for a password.

     Sync did not change this, and the last two checks are what hold it to
     that: signing in is a screen you can go to, never one you have to get
     past. The sync screen has a password field of its own — see section 11 —
     but a cold launch must never be looking at it. */
  localStorage.removeItem('digijournal.session');
  localStorage.removeItem('digijournal.sync');
  await load('../index.html');
  await until(() => $('.home-title'));
  ok(!!$('.home-title'), 'a cold launch opens straight onto the list');
  ok(!$('.gate') && !$('#gate-input'), 'no password screen stands in the way');
  ok(!$('input[type="password"]'), 'nothing on the way in asks for a password');
  ok(!$('.account-form'), 'and signing in is not what the app opens on');
  ok($('.empty h2')?.textContent === 'Nothing written yet', 'empty state shown');
  /* The invitation "Start writing…" used to be, now that the bar is
     navigation and the quill is a tool rather than a greeting. It is on this
     screen only — a journal with entries in it does not need asking twice. */
  ok($('.empty-btn')?.textContent === 'Write the first entry',
     'an empty journal asks for the first entry in words', $('.empty-btn')?.textContent);

  /* --------------------------------------------- 1b. the day's rating
     The card is on the LIST and it rates today. Everything below is the
     separation itself: rating a day is not writing an entry, so it must be
     possible with an empty journal and must leave the journal empty. */
  ok(!!$('.mood'), 'the rating card is on the list');
  const moods = $$('.mood-opt');
  ok(moods.length === 5, 'five mood faces');
  ok(moods.every((m) => m.getAttribute('aria-checked') === 'false'), 'the day starts unrated');
  /* Every face names itself, so the ramp is readable before you touch it and
     colour is never the only thing telling them apart. */
  ok($$('.mood-name').map((n) => n.textContent).join() === 'Awful,Low,Neutral,Good,Stellar',
     'each face is named under itself', $$('.mood-name').map((n) => n.textContent).join());
  ok($('.mood-prompt').textContent === 'Today I feel…', 'the card asks for the rating',
     $('.mood-prompt').textContent);
  ok($('.mood').getAttribute('aria-labelledby') === $('.mood-prompt').id,
     "the prompt is the radiogroup's name");

  moods[3].click();
  await wait(200);
  ok(moods[3].getAttribute('aria-checked') === 'true', 'tapping a mood selects it');
  ok($('.mood-opt[aria-checked="true"] .mood-name').textContent === 'Good',
     'the chosen face is the named one',
     $('.mood-opt[aria-checked="true"] .mood-name').textContent);
  /* The heading is a sentence the rating finishes, so the word is the second
     channel the colour is not allowed to be alone on — said out loud rather
     than left to the fill. */
  ok($('.mood-said').textContent === ' good', 'the prompt finishes its sentence',
     $('.mood-said').textContent);
  ok(S().rating() === 4, "today's rating persisted", String(S().rating()));
  /* THE POINT OF THE WHOLE CHANGE. A rating is a row against the day; it is
     not an entry, and it does not conjure one to live in. */
  ok(S().count() === 0, 'rating the day writes no entry', `count=${S().count()}`);
  ok($('.empty h2')?.textContent === 'Nothing written yet',
     'and the journal is still empty behind the card');

  moods[3].click();
  await wait(200);
  ok(S().rating() === null, 'tapping the selected mood clears it');
  moods[3].click();
  await wait(200);
  ok(S().rating() === 4, 'and rating it again sets it back');

  /* ------------------------------------------------------ 2. write & publish */
  const bar = $('#bar');
  ok(!bar.hidden, 'the bar is visible on home');
  ok(!$('.bar-nav').hidden && $('.compose').hidden,
     'on a peer screen the bar is the three tabs, not an action');
  ok($$('.bar-tab').length === 3, 'three tabs: Journal, Calendar, Settings');
  ok($('.bar-nav').dataset.tab === '0', 'the Journal tab is the current one',
     $('.bar-nav').dataset.tab);
  ok($$('.bar-tab')[0].getAttribute('aria-current') === 'page',
     'and says so with aria-current, not colour alone');
  /* The mark on the live tab is a CIRCLE, not a lozenge — the pane is only
     as wide as its three targets, so the selection is square in both
     directions and rounds to a circle. A width that drifts off --tap is how
     it turns back into an oval. */
  const selBox = $('.bar-nav-sel').getBoundingClientRect();
  ok(Math.abs(selBox.width - selBox.height) <= 1 && Math.round(selBox.width) === 44,
     'the selection is a 44pt circle, not an oval',
     `${Math.round(selBox.width)}x${Math.round(selBox.height)}`);
  /* And the live tab differs in ink as well as in that circle — two channels,
     never one. */
  ok(cs($$('.bar-tab')[0]).color !== cs($$('.bar-tab')[1]).color,
     'the live tab is full-strength ink against the other two');

  /* Narrower than the width it used to stretch to: the pane hugs its three
     targets and the quill floats at the far end. */
  ok(Math.round($('.bar-nav').getBoundingClientRect().width) === 132,
     'the pane is exactly its three tabs wide, and no wider',
     `${Math.round($('.bar-nav').getBoundingClientRect().width)}`);
  ok($('.bar-side').getAttribute('aria-label') === 'Write a new entry',
     'the capsule is the quill', $('.bar-side').getAttribute('aria-label'));
  ok($('.bar-side').dataset.tone === 'accent', 'the quill is the one filled thing in the bar');

  /* NOT AWAITED, ON PURPOSE — this is the keyboard check, and the only one
     the suite can make. iOS raises the on-screen keyboard for a focus() that
     happens inside the tap that asked for it and for no other, so the whole
     navigation has to be finished by the time click() returns. Defer the
     render to a hashchange or the focus to a requestAnimationFrame and the
     caret lands a turn later: this fails, and on the phone the draft opens
     with a caret in it and no keyboard under it. See go() in app.js. */
  $('.bar-side').click();
  ok(f.contentWindow.document.activeElement === $('.entry-title-field'),
     'the caret is in the new draft before the tap returns',
     f.contentWindow.document.activeElement?.className);

  await wait(300);
  ok(f.contentWindow.location.hash.startsWith('#/e/'), 'the quill opens a new entry', f.contentWindow.location.hash);
  ok($('.bar-nav').hidden && !$('.compose').hidden,
     'inside an entry the tabs give way to the action');
  ok($('.compose').dataset.mode === 'publish', 'bar became the publish button');
  ok($('.compose').textContent === 'Publish', 'publish button labelled Publish');
  ok($('.compose').disabled === true, 'publish disabled while the entry is empty');
  /* .bar-inner centres its children so the nav pane and the quill sit
     together in the middle. That must not shrink-wrap the action state too:
     the pill is flex: 1 and claims the free space before justification sees
     any, so Publish still spans everything the capsule beside it leaves. */
  const barInner = $('.bar-inner').getBoundingClientRect();
  const pillBox  = $('.compose').getBoundingClientRect();
  ok(pillBox.width >= barInner.width - 60,
     'the action pill still fills the bar, centring notwithstanding',
     `${Math.round(pillBox.width)} of ${Math.round(barInner.width)}`);
  ok($('.entry-title-field').readOnly === false, 'new entry opens in edit mode');
  ok($('.bar-side').getAttribute('aria-label') === 'Delete entry',
     'while writing, the bar capsule is Delete', $('.bar-side').getAttribute('aria-label'));
  ok($('.bar-side').dataset.tone === 'danger', 'the delete capsule is toned as destructive');

  type($('.entry-title-field'), 'A day in August');
  type($('.entry-body-field'), 'Woke up late. The light through the kitchen window was\nvery good today, and I did not waste it.');
  await wait(600);
  ok($('.compose').disabled === false, 'publish enabled once something is written');
  ok(S().count() === 1, 'entry persisted while typing', `count=${S().count()}`);

  const growing = $('.entry-body-field');
  ok(parseInt(growing.style.height) > 0, 'body field auto-grew', growing.style.height);

  $('.compose').click();
  await wait(500);
  ok(f.contentWindow.location.hash === '#/', 'publishing returns to the list', f.contentWindow.location.hash);
  ok($$('.entry-row').length === 1, 'the entry is in the list');
  ok($('.entry-title').textContent === 'A day in August', 'row shows the title');
  ok($('.entry-preview').textContent.startsWith('Woke up late'), 'row shows the body preview');
  ok(!$('.entry-flag'), 'published entry has no Draft flag');
  ok(/entry|entries/.test($('.home-sub')?.textContent || ''), 'home subtitle counts entries');

  /* ------------------------------------------------------ 3. read mode */
  $('.entry-row').click();
  await wait(300);
  ok($('.entry-title-field').readOnly === true, 'a published entry opens in read mode');
  /* The bar used to slide away here, which made this the one screen in the
     app with no bottom chrome and put the pencil in the far top corner. */
  ok($('#bar').hidden === false, 'reading keeps the bar');
  ok($('.compose').dataset.mode === 'quiet' && $('.compose').textContent === 'Edit',
     'and the bar is a quiet Edit, not a filled field', $('.compose').dataset.mode);
  ok($('.bar-side').hidden === true, 'nothing beside it — reading is read-only in every sense');
  ok($('.entry-date').textContent.startsWith('Edited'), 'date line shows last edited', $('.entry-date').textContent);

  /* The ⋯ is gone, and so is the pencil that used to sit up here: delete
     lives beside Done, and Edit lives under the thumb. */
  ok(!$('.toolbar .icon-btn[aria-label="More actions"]'), 'no ⋯ menu on the entry screen');
  ok($$('.toolbar .icon-btn').length === 1
     && $$('.toolbar .icon-btn')[0].getAttribute('aria-label') === 'Back',
     'the entry toolbar holds back and nothing else',
     $$('.toolbar .icon-btn').map((b) => b.getAttribute('aria-label')).join());

  /* The rating went with it. The entry screen is the writing and nothing
     else now — no card, and no mood on the entry to carry one. */
  ok(!$('.mood'), 'no rating card on the entry screen');
  ok(!('mood' in S().all()[0]), 'and an entry no longer holds a mood at all',
     Object.keys(S().all()[0]).join());

  /* Not awaited either, and for the same reason as the quill: Edit focuses a
     field, so it has to have done it by the time the tap returns. */
  $('.compose').click();
  ok(f.contentWindow.document.activeElement === $('.entry-body-field'),
     'Edit takes the caret inside the tap, so iOS raises the keyboard',
     f.contentWindow.document.activeElement?.className);
  await wait(250);
  ok($('.entry-title-field').readOnly === false, 'Edit enters edit mode');
  ok($('.compose').textContent === 'Done', 'published entry says Done, not Publish');
  ok($('.compose').dataset.mode === 'publish', 'and the quiet pill becomes the filled one');
  ok($('.bar-side').getAttribute('aria-label') === 'Delete entry',
     'Edit opens an editor with Delete beside Done');
  /* Beside, not under: same row, delete to the right of the primary action. */
  const doneBox = $('.compose').getBoundingClientRect();
  const delBox = $('.bar-side').getBoundingClientRect();
  ok(delBox.left >= doneBox.right - 1 && Math.abs(delBox.top - doneBox.top) < 8,
     'Delete sits next to Done, on the same row',
     `done right ${Math.round(doneBox.right)} / delete left ${Math.round(delBox.left)}`);

  $('.compose').click();
  await wait(250);
  ok($('.entry-title-field').readOnly === true, 'Done returns to read mode');
  ok($('.bar-side').hidden === true, 'Done takes the delete capsule away');
  ok($('#bar').hidden === false, 'but leaves the bar, now offering Edit again');

  /* ------------------------------------------------------- 4. the calendar */
  f.contentWindow.history.back();
  await wait(350);
  ok(f.contentWindow.location.hash === '#/' || f.contentWindow.location.hash === '', 'back returns to the list');

  $$('.bar-tab')[1].click();
  await wait(350);
  ok(f.contentWindow.location.hash.startsWith('#/calendar'), 'the Calendar tab opens the calendar');
  ok($('.bar-nav').dataset.tab === '1', 'and the selection moved with it',
     $('.bar-nav').dataset.tab);
  ok($$('.cal-day:not([data-empty])').length >= 28, 'month grid rendered', String($$('.cal-day:not([data-empty])').length));
  const todayCell = $('.cal-day[data-today="true"]');
  ok(!!todayCell, 'today is marked');
  ok(todayCell.dataset.mood === '4', "today's cell carries the day's colour", `mood=${todayCell.dataset.mood}`);
  ok(todayCell.dataset.written === 'true', 'and the ring saying something was written');
  ok(todayCell.textContent === String(new Date().getDate()), 'the numeral survives the fill');
  ok($('.cal-stat-n').textContent === '1', 'stats count the month', $('.cal-stat-n').textContent);

  /* Today is the only rated day there is, so the month and the week must both
     be it — and the week's figure only stands while the current month is up. */
  const statLabels = $$('.cal-stat-l').map((n) => n.textContent);
  ok(statLabels.includes("this week's average"),
     "the week's average sits beside the month's", statLabels.join(' / '));
  const weekN = $$('.cal-stats > div')
    .find((d) => d.querySelector('.cal-stat-l').textContent === "this week's average")
    .querySelector('.cal-stat-n').textContent;
  ok(weekN === '4.0', 'and it averages the days rated this week', weekN);

  $('.icon-btn[aria-label="Previous month"]').click();
  await wait(300);
  ok(!$$('.cal-stat-l').some((n) => n.textContent === "this week's average"),
     'last month does not get to report this week');
  $('.icon-btn[aria-label="Next month"]').click();
  await wait(300);
  ok($$('.cal-stat-l').some((n) => n.textContent === "this week's average"),
     'and it comes back with the current month');

  ok($$('.cal-key-item').length === 5, 'the key explains the ramp');
  const future = $$('.cal-day[aria-disabled="true"]');
  ok(future.every((d) => d.disabled), 'future days are not writable');

  /* The calendar is a PEER of the list, not a detour off it: no back button
     anywhere on it, and the capsule is the same quill it is everywhere. */
  ok($('.bar-side').getAttribute('aria-label') === 'Write a new entry',
     'the capsule is still the quill on the calendar', $('.bar-side').getAttribute('aria-label'));
  ok(!$('.toolbar .icon-btn[aria-label="Back"]'), 'no back button on a peer screen');

  /* A tab REPLACES rather than pushes: three peers are not a trail. */
  const beforeTabs = f.contentWindow.history.length;
  $$('.bar-tab')[0].click();
  await wait(400);
  ok(f.contentWindow.location.hash === '#/' || f.contentWindow.location.hash === '',
     'the Journal tab returns to the list', f.contentWindow.location.hash);
  ok(f.contentWindow.history.length === beforeTabs,
     'and stepping between tabs stacks no history',
     `${beforeTabs} → ${f.contentWindow.history.length}`);
  ok($('.bar-nav').dataset.tab === '0', 'the selection is back on the Journal');

  /* --------------------------------------------------- 5. drafts behaviour */
  f.contentWindow.location.hash = '#/';
  await wait(300);
  const before = S().count();
  $('.bar-side').click();
  await wait(300);
  f.contentWindow.history.back();
  await wait(400);
  ok(S().count() === before, 'an untouched draft is discarded on leaving', `${before} → ${S().count()}`);

  $('.bar-side').click();
  await wait(300);
  type($('.entry-body-field'), 'half a thought');
  await wait(600);
  f.contentWindow.history.back();
  await wait(400);
  ok(S().count() === before + 1, 'a draft with content is kept');
  ok($$('.entry-flag').length === 1, 'the kept draft is flagged as a draft');
  ok($$('.entry-row')[0].querySelector('.entry-title').textContent === 'half a thought',
     'an untitled entry uses its first line as the title');

  /* ------------------------------------------------------ 6. export/import */
  const bundle = S().exportBundle();
  ok(bundle.app === 'digijournal' && bundle.entries.length === store.count(), 'export bundles every entry');
  const merged = store.importBundle(bundle);
  ok(merged.added === 0 && merged.updated === 0, 're-importing the same bundle changes nothing');
  const foreign = { app: 'digijournal', schema: 1, entries: [{ id: 'zzz', title: 'From another phone', body: 'x', mood: 2, day: '2026-01-04', createdAt: 1, updatedAt: 2, published: true }] };
  ok(store.importBundle(foreign).added === 1, 'importing a new entry adds it');
  let threw = false;
  try { store.importBundle({ nope: true }); } catch { threw = true; }
  ok(threw, 'importing a non-backup is rejected');

  /* ------------------------------------------------------------ 7. a11y */
  f.contentWindow.location.hash = '#/';
  await wait(300);
  const unlabelled = $$('button').filter((b) => !b.textContent.trim() && !b.getAttribute('aria-label'));
  ok(unlabelled.length === 0, 'every icon button has a label', unlabelled.map((b) => b.className).join());
  ok($('#screen').getAttribute('tabindex') === '-1', 'screen is focusable for route announcements');

  /* ------------------------------------------- 7a. no borrowed system blue
     The screen host is focused on every navigation. It is `inset: 0`, so a
     focus ring on it is a blue rectangle around the whole phone — which is
     what it was. It stays focusable; it just stops being drawn. */
  ok(f.contentDocument.activeElement === $('#screen'),
     'the screen host really does hold focus after a navigation',
     f.contentDocument.activeElement?.id || f.contentDocument.activeElement?.tagName);
  ok(cs($('#screen')).outlineStyle === 'none',
     'the focused screen host draws no ring',
     `${cs($('#screen')).outlineStyle} ${cs($('#screen')).outlineColor}`);

  const transparent = (c) => /rgba\(0, 0, 0, 0\)|transparent/.test(c || '');
  ok(transparent(cs(f.contentDocument.documentElement).webkitTapHighlightColor),
     'the tap flash is off at the root, where everything inherits it',
     cs(f.contentDocument.documentElement).webkitTapHighlightColor);
  ok(transparent(cs($('.compose')).webkitTapHighlightColor),
     'and a button inherits it rather than keeping the UA default',
     cs($('.compose')).webkitTapHighlightColor);

  /* Selection is the one highlight the app draws, and it is ink, not the
     phone's accent. Chrome resolves ::selection through getComputedStyle;
     if a future engine doesn't, read the stylesheet instead of guessing. */
  const selBg = cs($('.compose'), '::selection').backgroundColor;
  ok(selBg ? !/rgb\(0, 0, 255\)|rgba?\(\s*0,\s*10[0-9],\s*2[0-9][0-9]/.test(selBg)
           : /::selection/.test(await (await fetch('../css/base.css')).text()),
     'selected text is washed in ink, not system blue', selBg || '(read from base.css)');

  /* tap targets */
  f.contentWindow.location.hash = '#/calendar';
  await wait(300);
  const small = $$('.cal-day:not([data-empty]), .icon-btn, .bar-side, .bar-tab, .mood-opt, .compose').filter((n) => {
    if (n.hidden || n.offsetParent === null) return false;   /* not on screen */
    const r = n.getBoundingClientRect();
    return r.width < 44 || r.height < 44;
  });
  ok(small.length === 0, 'all controls meet the 44px minimum', small.slice(0, 3).map((n) => `${n.className}:${Math.round(n.getBoundingClientRect().width)}x${Math.round(n.getBoundingClientRect().height)}`).join(' '));

  /* ------------------------------------------- 7b. the glass on the chrome */
  f.contentWindow.location.hash = '#/';
  await until(() => f.contentDocument.querySelector('.entry-row'));
  $$('.entry-row').find((r) => !r.querySelector('.entry-flag')).click();
  await wait(350);

  /* The entry's back button is the ONLY toolbar capsule left in the app —
     the pencil came down into the bar and the gear became a tab — so it is
     what the glass rules are read off now. */
  const backBtn = $('.toolbar .icon-btn[aria-label="Back"]');
  ok(!!backBtn, 'the entry carries a back button, and it is the app\'s only one');
  ok(!$('.toolbar .icon-btn[aria-label="Edit entry"]'),
     'the pencil is not in the toolbar — it is the bar');
  const editStyle = cs(backBtn);
  const blurOf = (s) => s.backdropFilter || s.webkitBackdropFilter || '';
  ok(blurOf(editStyle).includes('blur'), 'the capsule has the glass blur', blurOf(editStyle));
  ok(editStyle.boxShadow !== 'none', 'the capsule has the specular edge and lift');
  ok(!/rgba\(0, 0, 0, 0\)|transparent/.test(editStyle.backgroundColor),
     'the capsule has the glass tint', editStyle.backgroundColor);
  ok(cs($('.bar-side')).borderRadius === editStyle.borderRadius ||
     editStyle.borderRadius.startsWith('999'),
     'and wears the same capsule as the bar button', editStyle.borderRadius);

  /* The capsules float over the column, so the column has to start below
     them — and not by a hairline. Clearing them by 1px still reads as the
     title being tucked under the buttons, which is what --chrome-air is for.
     This is the whole reason .screen-inner pays for the chrome and no screen
     header adds a top padding of its own. */
  const capsuleBottom = Math.max(...$$('.toolbar .icon-btn').map((b) => b.getBoundingClientRect().bottom));
  const headTop = $('.entry-title-field').getBoundingClientRect().top;
  ok(headTop - capsuleBottom >= 12, 'the entry title clears the toolbar capsules with air',
     `gap ${Math.round(headTop - capsuleBottom)}px (title ${Math.round(headTop)}, capsules ${Math.round(capsuleBottom)})`);

  /* The column starts a real step below the bar, not flush against it. */
  const innerPadTop = parseFloat(cs($('.screen-inner')).paddingTop);
  const toolbarH = $('#toolbar').getBoundingClientRect().height;
  ok(innerPadTop - toolbarH >= 12, 'the column starts a step below the toolbar',
     `padding-top ${Math.round(innerPadTop)} vs toolbar ${Math.round(toolbarH)}`);

  /* The bottom bar is measured once. --chrome-bottom must equal what the bar
     actually covers: if the bar adds the home-indicator inset on top of its
     own pad, or --chrome-bottom counts that inset a second time, these two
     drift apart and every screen pads for a bar that isn't that tall. */
  const barBox = $('#bar').getBoundingClientRect().height;
  const innerPadBottom = parseFloat(cs($('.screen-inner')).paddingBottom);
  const s12 = 48;
  ok(Math.abs((innerPadBottom - s12) - barBox) <= 1,
     '--chrome-bottom is exactly what the composer bar covers',
     `chrome-bottom ${Math.round(innerPadBottom - s12)} vs bar ${Math.round(barBox)}`);

  /* The bar's floor is the home indicator's band, via max() and never a sum.
     This browser reports no inset, which is the case worth pinning: the
     max() has to fall through to --s-3 rather than collapsing to nothing. */
  ok(parseFloat(cs($('#bar')).paddingBottom) === 12,
     'with no home indicator the bar stands on --s-3, not on nothing',
     cs($('#bar')).paddingBottom);

  /* Scrolled, the toolbar is the glass — the buttons must drop theirs so the
     two panes don't stack. Drive the attribute directly: whether a given
     entry is long enough to scroll is a property of the fixture, not of the
     rule being tested. */
  $('#toolbar').dataset.scrolled = 'true';
  await wait(250);
  const scrolledStyle = cs($('.toolbar .icon-btn[aria-label="Back"]'));
  ok(!blurOf(scrolledStyle).includes('blur'), 'button glass gives way to the toolbar glass',
     blurOf(scrolledStyle) || '(none)');
  ok(cs($('#toolbar')).backdropFilter.includes('blur'), 'the toolbar itself is the glass when scrolled');
  await wait(400);   /* the fade is 260ms; let it finish before reading it */
  ok(cs($('.toolbar-title')).opacity === '1', 'the toolbar title fades in when scrolled',
     cs($('.toolbar-title')).opacity);
  $('#toolbar').dataset.scrolled = 'false';

  /* And the real thing — but a list only scrolls if it overflows, so give it
     enough rows to. */
  store.importBundle({ app: 'digijournal', schema: 1, entries: Array.from({ length: 12 }, (_, i) => ({
    id: 'M' + i, title: 'A day worth remembering ' + i, mood: (i % 5) + 1,
    body: 'Enough words in the preview to give the row its full height, twice over.',
    day: S().dayKey(), createdAt: Date.now() - i * 86400000, updatedAt: Date.now() - i * 1000,
    published: true,
  })) });
  f.contentWindow.location.hash = '#/';
  f.contentWindow.location.reload();
  await until(() => f.contentDocument.querySelectorAll('.entry-row').length > 10);
  await wait(300);

  const pane = f.contentDocument.getElementById('screen');
  pane.scrollTop = pane.scrollHeight;      /* a real scroll fires a real event */
  await wait(400);
  ok(pane.scrollTop > 8, 'the list scrolls when it overflows', `scrollTop=${pane.scrollTop}`);
  ok(f.contentDocument.getElementById('toolbar').dataset.scrolled === 'true',
     'toolbar materialises once the list is scrolled');
  pane.scrollTop = 0;
  await wait(300);

  /* ------------------------------------------------- 8. layout on a phone */
  const win = f.contentWindow;
  const doc = f.contentDocument;
  ok(win.innerWidth >= 375 && win.innerWidth <= 390, 'iframe really is phone-width', `${win.innerWidth}x${win.innerHeight}`);

  const seedEntries = [
    { id: 'L1', title: 'A title long enough to need truncating on a narrow screen', body: 'Walked home the long way because the evening was warm and I was not ready to be indoors yet. Stopped at the bookshop on the corner, bought nothing, stayed twenty minutes anyway.', mood: 4, day: S().dayKey(), createdAt: Date.now(), updatedAt: Date.now(), published: true },
  ];
  store.importBundle({ app: 'digijournal', schema: 1, entries: seedEntries });
  win.location.hash = '#/';
  win.location.reload();
  await until(() => f.contentDocument.querySelector('.entry-row'));
  await wait(300);

  const noOverflow = (label) => {
    const d = f.contentDocument;
    const vw = f.contentWindow.innerWidth;
    ok(d.documentElement.scrollWidth <= vw, `${label}: page does not scroll sideways`,
       `scrollWidth=${d.documentElement.scrollWidth} vw=${vw}`);
    const spills = [...d.querySelectorAll('.entry-title, .entry-preview, .entry-meta, .cal-grid, .compose, .home-title, .entry-body-field')]
      .filter((n) => { const r = n.getBoundingClientRect(); return r.right > vw + 0.5 || r.left < -0.5; });
    ok(spills.length === 0, `${label}: nothing spills past the edge`,
       spills.map((n) => `${n.className}@${Math.round(n.getBoundingClientRect().right)}`).join(' '));
  };

  noOverflow('list');

  /* The bar element itself reaches the physical bottom edge — it is its own
     padding, never a gap under it, that holds the capsule off the indicator.
     If the BAR stops short, something outside our CSS is insetting the app
     and tools/edges.html is the instrument for that, not this file.
     Measured on the list, where the bar is actually on screen — while
     reading, it is translated 120% away. */
  const flushToBottom = (sel, label) => {
    const bottom = $(sel).getBoundingClientRect().bottom;
    ok(Math.abs(bottom - win.innerHeight) <= 1, label,
       `${Math.round(bottom)} vs viewport ${win.innerHeight}`);
  };
  flushToBottom('#bar', 'the bar reaches the physical bottom of the screen');

  /* And the capsule sits exactly its floor above that edge — the pad and the
     inset must not stack, which is the failure the max() exists to prevent. */
  const floor = parseFloat(cs($('#bar')).paddingBottom);
  /* Whichever wide element is up — on the list that is the nav pill, and it
     is the same slot the composer occupied. */
  const pillGap = win.innerHeight - $('.bar-nav').getBoundingClientRect().bottom;
  ok(Math.abs(pillGap - floor) <= 1,
     'the capsule clears the edge by its floor exactly, with nothing stacked',
     `gap ${Math.round(pillGap)} vs --bar-bottom ${floor}`);

  /* --kb lifts BOTH the bar and the scroll pane, so a stray value leaves a
     band of bare --paper under the composer — which is what iOS padding the
     app looks like, and is not that. At rest, with nothing focused, it is
     zero, and no measurement wobble may talk it into anything else. */
  const kb = () => cs(f.contentDocument.documentElement).getPropertyValue('--kb').trim();
  ok(kb() === '0px', 'with no keyboard up, the bar is not lifted at all', kb() || '(unset)');
  $('#screen').focus();
  f.contentWindow.visualViewport?.dispatchEvent(new f.contentWindow.Event('resize'));
  await wait(60);
  ok(kb() === '0px', 'and a viewport resize with nothing focused cannot lift it', kb());

  /* Nothing below the bar to see. Both lifts are zero, so the pane the
     journal scrolls in reaches the bottom edge too. */
  flushToBottom('#screen', 'the scroll pane reaches the bottom edge as well');

  /* No manifest. A linked one takes iOS down a path where black-translucent
     is ignored and the app is laid out inside the safe area, with iOS
     painting the home-indicator band itself — see the note in index.html.
     Everything it carried is in the Apple metas beside it. */
  /* Comments stripped first — index.html names the tag in the note
     explaining why it is not there. */
  const head = (await (await fetch('../index.html')).text())
    .replace(/<!--[\s\S]*?-->/g, '');
  ok(!/rel=["']manifest["']/.test(head), 'no web app manifest is linked',
     (head.match(/.*rel=["']manifest["'].*/) || [''])[0].trim());
  ok(/viewport-fit=cover/.test(head), 'the viewport is still told to cover the screen');
  /* `default`, never `black-translucent`. black-translucent makes the web
     view the screen's height MINUS THE STATUS BAR and anchors it at the top,
     so an equal strip at the bottom belongs to nobody and iOS paints it —
     measured on the phone as 852 screen, 793 given, 59 lost. */
  ok(/apple-mobile-web-app-status-bar-style"\s+content="default"/.test(head),
     'the status bar style is default, so the app runs to the bottom edge');
  ok(!/black-translucent/.test(head),
     'black-translucent is gone — it costs the bottom of the screen');
  ok(/apple-mobile-web-app-capable"\s+content="yes"/.test(head),
     'and the icon still launches standalone without the manifest');
  ok(/apple-mobile-web-app-title"\s+content="Digijournal"/.test(head),
     'the app keeps its name');
  ok(/rel="apple-touch-icon"/.test(head), 'and its icon');

  /* Belt and braces on the rule itself, not just this render. The inset is
     the clearance, so it may be reached for exactly once, inside a max().
     A sum is the bug: pad plus inset floats the bar a thumb's width up.
     Comments stripped first — tokens.css discusses both forms. */
  const sheets = (await Promise.all(['tokens', 'base', 'app']
    .map((n) => fetch(`../css/${n}.css`).then((r) => r.text()))))
    .join('\n').replace(/\/\*[\s\S]*?\*\//g, '');
  const insetUses = sheets.match(/[^;{}]*safe-area-inset-bottom[^;{}]*/g) || [];
  ok(insetUses.length === 1, 'the home-indicator inset is consulted in exactly one place',
     `${insetUses.length}: ${insetUses.map((s) => s.trim()).join(' | ')}`);
  ok(insetUses.every((use) => /max\(/.test(use)),
     'and only inside a max(), never summed with a pad of our own',
     insetUses.map((s) => s.trim()).join(' | '));

  /* Every screen begins at the same line — one step of --chrome-air below the
     toolbar — so the three of them agree about where a page starts. It is the
     same line, not the toolbar's own edge: a first line flush against the bar
     reads as tucked under the floating capsules. What must hold is that all
     three screens land on it identically, and that it is real air.
     Read the live document, not the one captured before the last reload. */
  const startsAtChrome = (sel, label) => {
    const chromeBottom = $('#toolbar').getBoundingClientRect().bottom;
    const node = $(sel);
    const top = node ? node.getBoundingClientRect().top : NaN;
    const air = top - chromeBottom;
    ok(air >= 12 && air < 40, `${label} begins one step below the toolbar`,
       `air ${Math.round(air)}px (top ${Math.round(top)}, toolbar ${Math.round(chromeBottom)})`);
  };
  startsAtChrome('.home-title', 'the list title');

  const longTitle = f.contentDocument.querySelector('.entry-title');
  ok(f.contentWindow.getComputedStyle(longTitle).textOverflow === 'ellipsis', 'long titles truncate rather than clip');

  f.contentWindow.location.hash = '#/calendar';
  await wait(400);
  noOverflow('calendar');
  /* The row, not the month name inside it: that title shares its line with
     two 44px buttons and centres against them. */
  startsAtChrome('.cal-head', 'the calendar header');

  f.contentWindow.location.hash = '#/e/L1';
  await wait(400);
  noOverflow('entry');
  startsAtChrome('.entry-title-field', "the entry's title");

  /* The other half of the --kb gate: it must still do its job. Shorten the
     visual viewport by a keyboard's worth with a field focused, and the bar
     has to ride up — otherwise the composer sits under the keyboard, which
     is the bug --kb exists for. The property is shadowed on the instance
     rather than faked with a real keyboard, which headless has none of. */
  const vvp = win.visualViewport;
  const trueHeight = vvp.height;
  const fakeViewport = (shorterBy) =>
    Object.defineProperty(vvp, 'height', { configurable: true, value: trueHeight - shorterBy });
  const settle = async () => { vvp.dispatchEvent(new win.Event('resize')); await wait(60); };

  fakeViewport(300);
  $('.entry-body-field').focus();
  await settle();
  ok(kb() === '300px', 'a real keyboard still lifts the bar clear of it', kb());

  $('.entry-body-field').blur();
  delete vvp.height;
  await settle();
  ok(kb() === '0px', 'and it drops back to the edge when the keyboard goes', kb());

  /* The phone's own standing disagreement between the two viewports is not
     the keyboard and must not be paid for twice. Stand them 40px apart with
     nothing focused — that is rest, and rest is zero — then open a keyboard
     on top of it. The lift is the keyboard alone, not the pair. */
  fakeViewport(40);
  await settle();
  ok(kb() === '0px', 'a standing viewport disagreement at rest lifts nothing', kb());

  fakeViewport(340);
  $('.entry-body-field').focus();
  await settle();
  ok(kb() === '300px', 'and the keyboard on top of it lifts by the keyboard alone', kb());

  $('.entry-body-field').blur();
  delete vvp.height;
  await settle();
  ok(kb() === '0px', 'back to the edge', kb());

  /* ------------------------------------------ 9. the sheet, and the toast */
  $('.compose').click();          /* Edit — it is in the bar now, not the toolbar */
  await wait(250);
  $('.bar-side[aria-label="Delete entry"]').click();
  await wait(350);

  const sheet = $('.menu');
  ok(!!sheet, 'delete asks for a second tap, in a sheet');
  ok(!!$('.menu-scrim'), 'the sheet dims the page behind it');
  /* Dimming alone separates nothing in dark mode — the blur is what does it,
     and it belongs on the layer that has the journal behind it. */
  const scrimStyle = f.contentWindow.getComputedStyle($('.menu-scrim'));
  ok(/blur/.test(scrimStyle.backdropFilter || scrimStyle.webkitBackdropFilter || ''),
     'the scrim, not the sheet, carries the blur',
     scrimStyle.backdropFilter || '(none)');
  /* A sheet sits on the scrim, and a flat wash is nothing to refract: glass
     there renders no blur and composites to a dead neutral. It is a card. */
  const sheetStyle = f.contentWindow.getComputedStyle(sheet);
  ok(!/blur/.test(sheetStyle.backdropFilter || sheetStyle.webkitBackdropFilter || ''),
     'the sheet is not glass — nothing behind it to blur',
     sheetStyle.backdropFilter || '(none)');
  ok(!/rgba/.test(sheetStyle.backgroundColor), 'the sheet is an opaque card',
     sheetStyle.backgroundColor);

  $('.menu-item').click();
  await wait(300);

  /* The toast was centred with translateX(-50%), which `rise` overwrote: it
     sat half its width right of centre for the length of the animation, then
     snapped back. Measure it while the animation is still filling. */
  const centreOf = (n) => { const r = n.getBoundingClientRect(); return (r.left + r.right) / 2; };
  const t = $('.toast');
  ok(!!t, 'deleting toasts');
  ok(Math.abs(centreOf(t) - f.contentWindow.innerWidth / 2) < 1, 'the toast is centred as it arrives',
     `centre ${Math.round(centreOf(t))} vs ${Math.round(f.contentWindow.innerWidth / 2)}`);
  await wait(400);   /* the rise is 260ms — it must not have moved since */
  ok(Math.abs(centreOf(t) - f.contentWindow.innerWidth / 2) < 1, 'and does not jump once it settles',
     `centre ${Math.round(centreOf(t))} vs ${Math.round(f.contentWindow.innerWidth / 2)}`);
  ok(!S().get('L1'), 'the entry is gone');

  /* ------------------------------------------------ 10. deleting, with a
     second device in the world

     Sync turned delete into a tombstone. The entry vanishes from every screen
     exactly as before, but a row stays behind saying it went — without that,
     the iPad still holds the entry, notices the phone doesn't, and helpfully
     sends it back on the next round. */
  ok(!S().get('L1'), 'a deleted entry is gone from the app');
  ok(!S().all().some((e) => e.id === 'L1'), 'and out of the list');
  ok(![...S().byDay().values()].some((e) => e.id === 'L1'), 'and off the calendar');

  const tomb = S().pushable(0).find((e) => e.id === 'L1');
  ok(!!tomb, 'but a tombstone is still there for sync to push');
  ok(tomb && tomb.deletedAt > 0, 'which records when it went');
  ok(tomb && tomb.title === '' && tomb.body === '',
     'and carries none of the words — a server stops holding what you deleted');

  /* ---------------------------------------------- 11. two devices, one entry
     Last edit wins, per entry. Everything below is that one rule seen from
     each side, because it is the only thing keeping two phones convergent. */
  const T = Date.now();
  const remote = (patch) => ({
    id: 'SYNC1', title: '', body: '', mood: null, day: '2026-08-01',
    createdAt: T - 9000, updatedAt: T, published: true, deletedAt: null, ...patch,
  });

  S().importBundle({ app: 'digijournal', schema: 1, entries: [
    { id: 'SYNC1', title: 'Written here', body: 'on the phone', mood: 3,
      day: '2026-08-01', createdAt: T - 9000, updatedAt: T - 5000, published: true },
  ] });
  ok(S().get('SYNC1').title === 'Written here', 'an entry exists on this device');

  S().mergeRemote([remote({ title: 'Edited on the iPad', updatedAt: T - 1000 })]);
  ok(S().get('SYNC1').title === 'Edited on the iPad',
     'a copy edited more recently elsewhere wins', S().get('SYNC1').title);

  S().mergeRemote([remote({ title: 'A stale copy', updatedAt: T - 8000 })]);
  ok(S().get('SYNC1').title === 'Edited on the iPad',
     'and an older one cannot roll it back', S().get('SYNC1').title);

  /* A tombstone travels the same way any other edit does. */
  S().mergeRemote([remote({ updatedAt: T, deletedAt: T })]);
  ok(!S().get('SYNC1'), 'a deletion made on another device lands here too');
  S().mergeRemote([remote({ title: 'Back from the dead', updatedAt: T - 2000 })]);
  ok(!S().get('SYNC1'), 'and a copy older than the deletion cannot undo it');

  /* THE ONE ENTRY SYNC MAY NOT TOUCH. A round landing mid-sentence must not
     replace the paragraph under the caret with the server's copy of it —
     app.js names the open entry, and the merge steps over it. */
  const open = S().create('2026-08-02');
  S().update(open.id, { title: 'Being typed right now' });
  S().mergeRemote(
    [remote({ id: open.id, title: 'From the server', updatedAt: Date.now() + 60000 })],
    { skip: open.id });
  ok(S().get(open.id).title === 'Being typed right now',
     'a sync landing mid-sentence leaves the open entry alone',
     S().get(open.id).title);
  /* …and stays skipped only while it is open: with no guard, the newer copy
     wins like anything else. */
  S().mergeRemote([remote({ id: open.id, title: 'From the server', updatedAt: Date.now() + 60000 })]);
  ok(S().get(open.id).title === 'From the server',
     'once it is closed, the ordinary rule applies again');

  /* An abandoned "Start writing…" must not become a blank row on the server,
     which is also why discarding one needs no tombstone. */
  const blank = S().create();
  ok(!S().pushable(0).some((e) => e.id === blank.id), 'an untouched draft is never pushed');
  S().update(blank.id, { body: 'a word' });
  ok(S().pushable(0).some((e) => e.id === blank.id),
     'and starts syncing the moment a character is typed into it');
  S().remove(blank.id);

  /* ------------------------------------------- 11b. two devices, one day
     The ratings travel on the same rule and their own watermark. A rating is
     a row against a day, so there is no tombstone here: CLEARING one is a row
     saying null, and that is what has to reach the other phone — otherwise a
     device still holding the old mood puts it straight back. */
  S().setRating(2, '2026-08-03');
  ok(S().rating('2026-08-03') === 2, 'a day is rated on this device');

  S().mergeRemoteRatings([{ day: '2026-08-03', mood: 5, updatedAt: Date.now() + 1000 }]);
  ok(S().rating('2026-08-03') === 5, 'a later rating from elsewhere wins',
     String(S().rating('2026-08-03')));
  S().mergeRemoteRatings([{ day: '2026-08-03', mood: 1, updatedAt: 1 }]);
  ok(S().rating('2026-08-03') === 5, 'and an older one cannot roll it back',
     String(S().rating('2026-08-03')));

  S().mergeRemoteRatings([{ day: '2026-08-03', mood: null, updatedAt: Date.now() + 2000 }]);
  ok(S().rating('2026-08-03') === null, 'clearing a rating travels between devices too');
  ok(S().pushableRatings(0).some((r) => r.day === '2026-08-03' && r.mood === null),
     'and the cleared day is still pushed, or the other phone would put it back');
  ok(!S().ratingsByDay().has('2026-08-03'),
     'though every screen sees a cleared day as simply unrated');

  /* An entry and its day are independent in both directions — the whole
     reason for the split. Deleting Wednesday's entry leaves Wednesday's
     colour on the calendar. */
  S().setRating(3, '2026-08-04');
  const wed = S().create('2026-08-04');
  S().update(wed.id, { title: 'Wednesday' });
  S().remove(wed.id);
  ok(S().rating('2026-08-04') === 3, "deleting a day's entry leaves the day's rating alone",
     String(S().rating('2026-08-04')));

  /* And a journal written before the split still knows how its days went:
     the mood on an old entry is adopted as that day's rating. */
  S().importBundle({ app: 'digijournal', schema: 1, entries: [
    { id: 'OLD1', title: 'Before the split', body: 'x', mood: 5, day: '2026-07-04',
      createdAt: 1, updatedAt: 2, published: true },
  ] });
  ok(S().rating('2026-07-04') === 5, "an old entry's mood becomes its day's rating",
     String(S().rating('2026-07-04')));

  /* ------------------------------------------------------ 12. the update path
     An update reloads the app out from under you. Two things have to hold, or
     it costs an entry: whatever you had typed is in storage BEFORE the page
     goes, and the whole journal is still there when it comes back. */
  $('.bar-side').click();         /* the quill */
  await wait(300);
  const updateId = f.contentWindow.location.hash.replace('#/e/', '');

  type($('.entry-title-field'), 'Mid-sentence');
  type($('.entry-body-field'), 'Typed, not yet saved.');
  /* Deliberately inside the 400ms debounce — this is the keystroke a naive
     reload would eat. */
  ok(S().get(updateId).title === '', 'the debounce really is still holding it');

  f.contentWindow.dispatchEvent(new f.contentWindow.CustomEvent('dj:flush'));
  await wait(50);
  ok(S().get(updateId).title === 'Mid-sentence', 'dj:flush writes the title before the reload');
  ok(S().get(updateId).body === 'Typed, not yet saved.', 'dj:flush writes the body too');

  $('.compose').click();          /* publish it, so it is a row in the list */
  await wait(300);

  const kept = S().all().length;
  ok(kept > 0, 'there is a journal to lose', `${kept} entries`);

  /* The reload itself — exactly what an update landing looks like. */
  await load('../index.html');
  await until(() => $('.home-title'));
  ok(!$('.gate'), 'the reload lands on the list, with nothing to unlock');
  ok(S().all().length === kept, 'the journal survives the reload', `${S().all().length} of ${kept}`);
  ok(S().get(updateId)?.title === 'Mid-sentence', 'and the entry written just before it is intact');
  ok($$('.entry-title').some((n) => n.textContent === 'Mid-sentence'),
     'and it is on the list after the reload');

  /* The worker only ever caches and deletes the app's own files. Bumping
     VERSION is the blunt instrument, and it must stay a blunt instrument
     pointed at the cache, never at the journal. */
  if (f.contentWindow.caches) {
    const cacheNames = await f.contentWindow.caches.keys();
    ok(cacheNames.every((k) => k.startsWith('digijournal-v')),
       'the only caches are the worker\'s own', cacheNames.join(', ') || '(none yet)');
  }
  ok(localStorage.getItem('digijournal.v1') !== null,
     'the journal is in localStorage, which no cache operation touches');

  /* -------------------------------------------------- 13. the settings screen
     A door off the list, never a gate in front of it. */
  f.contentWindow.location.hash = '#/';
  await until(() => $('.home-title'));
  await wait(200);

  /* Settings is a tab now, not a gear in the corner of one screen — so the
     list's toolbar is empty and the door is in the bar, on every screen. */
  ok($$('.toolbar .icon-btn').length === 0, 'the list toolbar holds nothing at all',
     $$('.toolbar .icon-btn').map((b) => b.getAttribute('aria-label')).join());
  const settingsTab = $$('.bar-tab')[2];
  /* The tab carries the sync state, and that state has to reach someone who
     cannot see its tone — so it is in the name. */
  ok(/not signed in/.test(settingsTab.getAttribute('aria-label')),
     "the Settings tab's name carries the sync state, not just its colour",
     settingsTab.getAttribute('aria-label'));

  settingsTab.click();
  await wait(350);
  ok(f.contentWindow.location.hash === '#/settings', 'it opens the settings screen',
     window.__dbg);
  ok($('.bar-nav').dataset.tab === '2', 'and the selection followed it there',
     $('.bar-nav').dataset.tab);
  ok(!!$('.account-form'), 'signed out, Settings carries a sign-in form');
  ok(!!$('input[type="password"]'), 'and this is the one place that asks for a password');

  /* SIGN IN IS IN THE FORM, NOT THE BAR. The bar is the way OFF this screen
     now, so it cannot also be the button on it — that is what would strand
     someone here. It is still the same accent capsule, and still the button
     the phone's Go key presses. */
  const signIn = $('.account-form button[type="submit"]');
  ok(!!signIn && signIn.textContent === 'Sign in',
     'the sign-in button is a real submit at the foot of its own form',
     signIn?.textContent);
  ok(!signIn.classList.contains('sr-only'), 'and it is visible, not a hidden submit');
  ok(signIn.disabled === true, 'disabled until there is something to send');
  ok(!$('.bar-nav').hidden, 'the bar stays the three tabs, so Settings is never a trap');

  type($('#account-email'), 'someone@example.com');
  await wait(80);
  ok(signIn.disabled === true, 'still disabled with only an email');
  type($('#account-password'), 'not-the-real-one');
  await wait(80);
  ok(signIn.disabled === false, 'and live once both fields are filled');

  /* iOS zooms the page in on a focused field set below 16px. A page that
     jumps on the first tap of a password is the app losing its footing at
     the worst possible moment. */
  ok(parseFloat(cs($('#account-password')).fontSize) >= 16,
     'the fields are 16px or more, so focusing one does not zoom the page',
     cs($('#account-password')).fontSize);

  /* ------------------------------------------------- 13b. the seven colours
     A palette is a set of tokens swapped on the root, so the checks that
     matter are: the picker offers all seven, choosing one really repaints the
     page (not just the swatch), the choice survives a reload, the status bar
     meta follows the paper, and no palette costs the app its legibility.

     The last one is the important one. Every palette's ink was SOLVED for a
     contrast ratio rather than picked, and this is what stops a later hand
     edit from quietly undoing that. */
  const root = () => f.contentDocument.documentElement;
  const tok = (name, node = root()) => cs(node).getPropertyValue(name).trim();

  /* WCAG 2.1 relative luminance. A custom property comes back as the text it
     was declared with rather than as a resolved rgb(), so this reads hex —
     which is what every palette token in tokens.css is written in. Reading
     the computed value rather than the stylesheet is the point: it is the
     colour that will actually be on the glass. */
  const rgbOf = (c) => {
    const h = String(c).trim().replace('#', '');
    if (/^[0-9a-f]{6}$/i.test(h)) return [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16));
    return (String(c).match(/[\d.]+/g) || []).slice(0, 3).map(Number);
  };
  const lum = (c) => {
    const [r, g, b] = rgbOf(c);
    const f_ = (x) => (x /= 255) <= 0.04045 ? x / 12.92 : ((x + 0.055) / 1.055) ** 2.4;
    return 0.2126 * f_(r) + 0.7152 * f_(g) + 0.0722 * f_(b);
  };
  const contrast = (a, b) => {
    const [x, y] = [lum(a), lum(b)].sort((m, n) => n - m);
    return (x + 0.05) / (y + 0.05);
  };

  const PALETTES = ['paper', 'bondi', 'blueberry', 'grape', 'tangerine',
                    'lime', 'strawberry', 'graphite'];

  const opts = $$('.palette-opt');
  ok(opts.length === PALETTES.length, 'Settings offers all eight palettes', `${opts.length}`);
  ok(opts.every((o) => o.textContent.trim().length > 1),
     'each one is named, so the choice is never carried by colour alone',
     opts.map((o) => o.textContent.trim()).join());
  ok($('.palette-row')?.getAttribute('role') === 'radiogroup',
     'and they are a real radiogroup, not seven buttons in a row');
  ok(opts.every((o) => o.getBoundingClientRect().height >= 44),
     'every chip clears the 44px minimum',
     opts.map((o) => Math.round(o.getBoundingClientRect().height)).join());

  ok(root().dataset.palette === 'paper',
     'an app that has never been to Settings is wearing the default',
     root().dataset.palette);
  ok(opts[0].getAttribute('aria-checked') === 'true',
     'and the picker says so rather than showing nothing chosen');

  /* Colour, and legibility, for every one of the seven. */
  for (let i = 0; i < PALETTES.length; i++) {
    opts[i].click();
    await wait(60);
    const name = PALETTES[i];
    ok(root().dataset.palette === name, `choosing ${name} repaints the page`, root().dataset.palette);

    const paper = tok('--paper');
    const body = contrast(tok('--ink'), paper);
    const meta = contrast(tok('--ink-2'), paper);
    const quiet = contrast(tok('--ink-3'), tok('--paper-sunk'));
    const onField = contrast(tok('--accent-ink'), tok('--accent'));
    const mark = contrast(tok('--accent-deep'), paper);

    ok(body >= 12, `${name}: body text clears 12:1 on its own paper`, body.toFixed(2));
    ok(meta >= 4.5, `${name}: secondary text clears 4.5:1`, meta.toFixed(2));
    ok(quiet >= 4.5, `${name}: the quietest ink clears 4.5:1 in a sunk field`, quiet.toFixed(2));
    ok(onField >= 4.5, `${name}: the Publish label clears 4.5:1 on the button`, onField.toFixed(2));
    /* --accent-deep exists precisely so Tangerine and Lime can have a bright
       button AND a legible link. This is the check that keeps them apart. */
    ok(mark >= 4.5, `${name}: a link or focus ring clears 4.5:1 on paper`, mark.toFixed(2));

    /* The mood ramp does not change with the palette — it is data, not
       chrome — so every step of it has to survive every paper. */
    for (let m = 1; m <= 5; m++) {
      ok(contrast(tok(`--mood-${m}`), paper) >= 3.5,
         `${name}: mood ${m} still reads on it`,
         contrast(tok(`--mood-${m}`), paper).toFixed(2));
    }
  }

  /* The chips are the palettes, not pictures of them: a chip carries its own
     data-palette, so it must resolve its own paper rather than the page's. */
  const chip = $('.palette-opt[data-palette="tangerine"]');
  ok(tok('--paper', chip) !== tok('--paper'),
     'a chip in the picker wears its own palette, not the page it sits on',
     `${tok('--paper', chip)} vs ${tok('--paper')}`);
  /* And its own derived tokens with it — a hairline that inherited the page's
     would be the wrong colour around the right paper. */
  ok(tok('--hairline', chip) !== tok('--hairline'),
     'and re-derives its own hairline rather than inheriting the page’s');

  /* Back to the default, then prove the choice is a property of this phone
     that survives the app being closed. */
  opts[PALETTES.indexOf('blueberry')].click();
  await wait(60);
  ok(localStorage.getItem('digijournal.palette') === 'blueberry',
     'the choice is written down', localStorage.getItem('digijournal.palette'));

  const bluePaper = tok('--paper');
  /* A distinct URL each time, so the iframe really navigates rather than
     being handed the page it is already showing. */
  await load('../index.html?relaunch=1');
  await until(() => $('.home-title'));
  ok(root().dataset.palette === 'blueberry',
     'and a cold launch opens wearing it', root().dataset.palette);
  ok(tok('--paper') === bluePaper, 'in the same colour it was left in');

  /* The status bar is iOS's strip of screen, above the web view, painted from
     theme-color alone — no stylesheet reaches it. If this drifts, Blueberry
     gets a cream bar over a blue page. */
  const metas = [...f.contentDocument.querySelectorAll('meta[name="theme-color"]')];
  ok(metas.length === 1, 'exactly one theme-color meta survives, so none can win over it',
     `${metas.length}`);
  ok(contrast(metas[0]?.content || '#000', tok('--paper')) < 1.05,
     'and it is the palette’s own paper, so the status bar does not seam',
     `${metas[0]?.content} vs ${tok('--paper')}`);

  localStorage.removeItem('digijournal.palette');
  await load('../index.html?relaunch=2');
  await until(() => $('.home-title'));
  ok(root().dataset.palette === 'paper',
     'clearing it falls back to the default rather than to no palette at all',
     root().dataset.palette);

  /* And the way out is the Journal tab, LANDED ON DIRECTLY — cold on
     #/settings, so there is no in-app history at all and the way out has to
     find the list without any. Settings has no back button any more; it does
     not need one, which is the point. A tab replaces rather than traverses,
     so this is also the version an iframe can measure honestly: history.back()
     is what Chrome refuses here, because a frame the harness navigated by
     assigning `src` carries no user activation behind those entries. */
  await load('../index.html?relaunch=3#/settings');
  await until(() => $('.bar-tab'));
  ok(!!$('input[type="password"]'), 'settings is reachable as a screen of its own');
  ok(!$('.toolbar .icon-btn[aria-label="Back"]'),
     'and carries no back button — a peer has nothing behind it');
  ok($('.bar-nav').dataset.tab === '2', 'the bar knows which screen it landed on',
     $('.bar-nav').dataset.tab);
  $$('.bar-tab')[0].click();
  await until(() => $('.home-title'));
  ok(!!$('.home-title'), 'the Journal tab returns to a journal that never needed unlocking',
     f.contentWindow.location.hash);
  ok(!$('input[type="password"]'), 'and no password field survives on the list');

  /* --------------------------------------------- 14. the key, and the lock
     The anon key ships inside the app, in a public repo. That is safe for
     exactly one reason: the row-level security policy. These four checks are
     the only automated thing standing between a slip and a public journal. */
  /* Comments first, always. These files DISCUSS service_role and imports at
     length precisely because both matter — reading the prose as if it were
     code is how a check like this cries wolf. */
  const stripJS = (src) => src
    .replace(/\/\*[\s\S]*?\*\//g, '')
    .replace(/(^|[^:])\/\/.*$/gm, '$1');

  const cfgSrc = stripJS(await (await fetch('../js/config.js')).text());
  const jwt = (cfgSrc.match(/eyJ[A-Za-z0-9_-]+\.eyJ[A-Za-z0-9_-]+/) || [''])[0];
  ok(!!jwt, 'config.js carries a key');
  let claims = {};
  if (jwt) {
    const b64 = jwt.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
    claims = JSON.parse(atob(b64 + '='.repeat((4 - b64.length % 4) % 4)));
  }
  /* service_role bypasses RLS by design. Pasted here it would make every
     entry readable by anyone who views source. */
  ok(claims.role === 'anon', 'and it is the anon key, never service_role', `role=${claims.role}`);
  ok(!/service_role/.test(cfgSrc), 'the service_role key appears nowhere in the app');

  const schemaSrc = await (await fetch('../supabase/schema.sql')).text();
  /* BOTH tables, not just the first. A table added later without RLS of its
     own is the one way the shipped key stops being safe to ship. */
  const rls = (schemaSrc.match(/enable row level security/gi) || []).length;
  ok(rls === 2, 'every table has row-level security switched on', `${rls} of 2`);
  const scoped = (schemaSrc.match(/using\s*\(auth\.uid\(\)\s*=\s*user_id\)/gi) || []).length;
  ok(scoped === 2, 'with a policy scoping every row to whoever owns it', `${scoped} of 2`);
  const checked = (schemaSrc.match(/with check\s*\(auth\.uid\(\)\s*=\s*user_id\)/gi) || []).length;
  ok(checked === 2,
     'on writes as well as reads — a policy without this lets anyone write into your journal',
     `${checked} of 2`);
  ok(/create table if not exists public\.days/i.test(schemaSrc),
     'and the day ratings have a table to sync into');

  /* --------------------------------------- 15. still no dependencies at all
     Supabase ships a client library; this app hand-writes the five requests
     it needs instead. Having no dependencies is a property of this app, and
     a CDN import is how that quietly stops being true. */
  const modules = ['app', 'store', 'ui', 'home', 'entry', 'mood', 'calendar',
                   'settings', 'theme', 'config', 'net', 'sync', 'update'];
  const sources = await Promise.all(
    modules.map((n) => fetch(`../js/${n}.js`).then((r) => r.text()).then(stripJS)));
  const outsideImports = sources.flatMap((src, i) =>
    [...src.matchAll(/\bfrom\s+['"]([^'"]+)['"]/g)]
      .map((m) => m[1])
      .filter((spec) => !spec.startsWith('./'))
      .map((spec) => `${modules[i]} → ${spec}`));
  ok(outsideImports.length === 0,
     'every import is a relative file in this repo', outsideImports.join(', '));

  /* ---------------------------------- 16. one person's journal, one account
     If a different account ever signs in on this device, the entries in
     storage belong to whoever was here before. Merging them into the new
     account would be the worst bug this app could have. Last, because it
     empties the journal. */
  ok(S().count() > 0, 'there is a journal here to protect', `${S().count()} entries`);
  S().clearJournal();
  ok(S().count() === 0, 'a different account starts empty rather than inheriting');
  ok(localStorage.getItem('digijournal.sync') === null,
     'and the sync watermarks go with it, so nothing is pushed into the wrong account');

  p('');
  p(failures === 0 ? `ALL PASS (${log.length - 1} checks)` : `${failures} FAILURE(S)`);
}

function report() {
  navigator.sendBeacon('/__result', out.textContent);
}

/* GUARD. This suite drives the real app against real storage: it clears
   digijournal.v1 before it starts. Opening this file by accident must never
   erase a journal, so it does nothing until you say so — ?run=1 for the
   automated path, the button for a human. */
function start() { run().then(report, (e) => { p('THREW: ' + (e && e.stack || e)); report(); }); }

if (new URLSearchParams(location.search).has('run')) {
  start();
} else {
  out.textContent = 'This erases this browser\'s journal and rebuilds it from scratch.';
  const b = document.createElement('button');
  b.textContent = 'Run the tests, erasing this journal';
  b.style.cssText = 'display:block;margin:12px 0;padding:10px 14px;font:inherit';
  b.onclick = () => { b.remove(); start(); };
  out.after(b);
}
</script>
</body></html>
