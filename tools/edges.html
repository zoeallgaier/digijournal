<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Edges</title>

<!-- The SAME launch chrome as the app. That is the whole point: this page has
     to be handed the screen the same way index.html is, or it measures a
     different app than the one with the problem. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Edges">
<meta name="theme-color" content="#F5F3EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101828" media="(prefers-color-scheme: dark)">

<style>
  :root { color-scheme: light dark; --bg: #F5F3EE; --fg: #141C2E; --dim: #606983; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #101828; --fg: #EFEDE7; --dim: #8B95B0; }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); }
  body {
    height: 100svh;
    overflow: hidden;
    color: var(--fg);
    font: 400 15px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  /* Two rules pinned to the very top and very bottom of the viewport. If the
     app has the whole screen, the bottom rule sits ON the screen's bottom
     edge, under the home indicator. If iOS has kept a band for itself, the
     rule floats above it and the gap IS the band. */
  .rule { position: fixed; left: 0; right: 0; height: 3px; background: #E4572E; z-index: 2; }
  .rule.top { top: 0; }
  .rule.bottom { bottom: 0; }

  /* The safe area, drawn. Dashed where iOS says the unsafe edges are. */
  .safe {
    position: fixed;
    top: env(safe-area-inset-top); right: env(safe-area-inset-right);
    bottom: env(safe-area-inset-bottom); left: env(safe-area-inset-left);
    border: 2px dashed #2F9E44;
    z-index: 1;
    pointer-events: none;
  }

  main { position: relative; z-index: 3; height: 100%; overflow-y: auto; padding: 8px 12px; }
  h1 { margin: 0 0 2px; font-size: 17px; letter-spacing: -0.01em; }
  p.lede { margin: 0 0 10px; color: var(--dim); font-size: 12px; line-height: 1.3; }
  table { border-collapse: collapse; width: 100%; }
  td { padding: 2px 0; vertical-align: baseline; }
  td.k { color: var(--dim); padding-right: 10px; white-space: nowrap; }
  td.v { font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
  tr.head td { padding-top: 9px; color: #E4572E; font-weight: 700; font-size: 12px; }
  .verdict { margin-top: 10px; padding: 8px 10px; border: 2px solid var(--fg); font-weight: 700; }
</style>
</head>
<body>
  <div class="rule top"></div>
  <div class="rule bottom"></div>
  <div class="safe"></div>

  <main>
    <h1>Edges</h1>
    <p class="lede">
      Orange = the top and bottom of what the app was given.
      Green dashed = where iOS says the safe area is.
      If the bottom orange line is not on the screen's edge, that gap is the band.
    </p>
    <table id="out"></table>
    <div class="verdict" id="verdict"></div>
  </main>

<script>
/* A probe whose padding is the four insets, so they can be read as numbers
   rather than inferred. env() is only readable through layout. */
const probe = document.createElement('div');
probe.style.cssText =
  'position:fixed;top:0;left:0;width:0;height:0;visibility:hidden;' +
  'padding:env(safe-area-inset-top) env(safe-area-inset-right) ' +
  'env(safe-area-inset-bottom) env(safe-area-inset-left);';
document.body.append(probe);
const inset = getComputedStyle(probe);

/* The same measurement app.js makes to decide the keyboard is up. */
const vv = window.visualViewport;
const covered = vv ? Math.round(window.innerHeight - vv.height - vv.offsetTop) : null;

/* Where a fixed, bottom:0 element actually lands — the composer's position. */
const bottomRule = document.querySelector('.rule.bottom').getBoundingClientRect();

const unit = (el, v) => { el.style.height = v; const h = el.getBoundingClientRect().height; return Math.round(h); };
const ruler = document.createElement('div');
ruler.style.cssText = 'position:fixed;top:0;left:0;width:1px;visibility:hidden;';
document.body.append(ruler);

const rows = [
  ['head', 'WHICH PATH iOS TOOK', ''],
  ['navigator.standalone', navigator.standalone === undefined ? 'undefined' : String(navigator.standalone)],
  ['display-mode', ['standalone', 'fullscreen', 'minimal-ui', 'browser']
      .find((m) => matchMedia(`(display-mode: ${m})`).matches) || '—'],

  ['head', 'THE INSETS iOS REPORTS', ''],
  ['safe-area top', inset.paddingTop],
  ['safe-area bottom', inset.paddingBottom],
  ['safe-area left / right', `${inset.paddingLeft} / ${inset.paddingRight}`],

  ['head', 'THE SCREEN vs WHAT WE GOT', ''],
  ['screen', `${screen.width} x ${screen.height}`],
  ['window.inner', `${window.innerWidth} x ${window.innerHeight}`],
  ['visualViewport', vv ? `${Math.round(vv.width)} x ${Math.round(vv.height)}` : 'none'],
  ['vv.offsetTop / pageTop', vv ? `${Math.round(vv.offsetTop)} / ${Math.round(vv.pageTop)}` : '—'],
  ['100svh / 100dvh / 100lvh', `${unit(ruler, '100svh')} / ${unit(ruler, '100dvh')} / ${unit(ruler, '100lvh')}`],

  ['head', 'WHERE THE COMPOSER WOULD SIT', ''],
  ['fixed bottom:0 lands at', `${Math.round(bottomRule.bottom)}`],
  ['…short of window.inner by', `${Math.round(window.innerHeight - bottomRule.bottom)}`],
  ['…short of screen.height by', `${Math.round(screen.height - bottomRule.bottom)}`],
  ['app.js would set --kb to', covered === null ? '—' : `${covered}px`],
];

const out = document.getElementById('out');
for (const row of rows) {
  const tr = document.createElement('tr');
  if (row[0] === 'head') {
    tr.className = 'head';
    const td = document.createElement('td');
    td.colSpan = 2; td.textContent = row[1];
    tr.append(td);
  } else {
    const k = document.createElement('td'); k.className = 'k'; k.textContent = row[0];
    const v = document.createElement('td'); v.className = 'v'; v.textContent = row[1];
    tr.append(k, v);
  }
  out.append(tr);
}

/* Say it in words, so the screenshot answers the question on its own. */
const bottomInset = parseFloat(inset.paddingBottom) || 0;
const gap = Math.round(screen.height - bottomRule.bottom);
document.getElementById('verdict').textContent =
  window.innerHeight >= screen.height - 1 && bottomInset > 0
    ? 'FULL-BLEED. The app has the whole screen; any band is ours.'
    : bottomInset === 0 && window.innerHeight < screen.height - 1
      ? `iOS KEPT A BAND. The app was given ${window.innerHeight} of ${screen.height}; ` +
        `${screen.height - window.innerHeight} is iOS’s, and no CSS can reach it.`
      : `UNCLEAR — inner ${window.innerHeight}, screen ${screen.height}, ` +
        `bottom inset ${bottomInset}, gap under a fixed bar ${gap}.`;
</script>
</body>
</html>
