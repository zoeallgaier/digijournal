<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Digijournal</title>

<!-- viewport-fit=cover is the whole reason the app reaches the physical edges
     of the screen: without it iOS lays the standalone web view out INSIDE the
     safe area and paints the status bar and home-indicator bands itself, which
     no stylesheet can then reach. Nothing else belongs on this line — an
     unrecognised directive here is one more thing between us and the only one
     that matters. (interactive-widget was Chrome-only and did nothing on the
     one device this app targets; the keyboard is handled by hand from
     visualViewport in app.js.) -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="description" content="A private daily journal.">
<meta name="robots" content="noindex, nofollow">

<!-- The status bar takes its colour from the page beneath it, in both
     schemes, so the top of the screen never seams. Scheme-aware, which a
     manifest's single theme_color could never be — see the note below on
     why there is no manifest. -->
<meta name="theme-color" content="#F5F3EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101828" media="(prefers-color-scheme: dark)">

<!-- These four are what make the icon a standalone app, and there is
     DELIBERATELY NO <link rel="manifest"> beside them.

     A linked web app manifest takes iOS down its modern path, where the
     manifest configures the app and `apple-mobile-web-app-status-bar-style`
     is ignored. Standalone still works — but the web view is laid out INSIDE
     the safe area, and iOS fills the leftover band around the home indicator
     with the theme colour itself. That is the block of off-white (light) or
     navy (dark) under the composer: not padding, a strip of screen the app
     was never given, which no stylesheet can reach into.

     Without the manifest, iOS uses the path below, where viewport-fit=cover
     plus black-translucent is the combination that hands the app the whole
     screen. Everything the manifest was carrying is here: standalone from
     -capable, the name from -title, the icon from apple-touch-icon. The one
     genuine loss is the portrait lock, and installability on Android and
     desktop — neither of which this app targets. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<!-- `default`, and NOT `black-translucent`. This is the line that was taking
     a strip of the screen, and it was measured on the phone, not guessed:

       screen            393 x 852
       window.inner      393 x 793
       fixed bottom:0    lands at 793 — 59 short of the screen

     852 - 793 = 59, which is the STATUS BAR's height, not the home
     indicator's 34. That is black-translucent's long-standing behaviour: it
     makes the web view the height of the screen minus the status bar and
     then anchors it at the TOP, so the page does draw under the clock —
     and an equal strip at the BOTTOM belongs to nobody. iOS paints it with
     the theme colour, which is why it read as a block of paper under the
     composer, and why nothing in the stylesheet could reach it.
     viewport-fit=cover does not rescue this on the no-manifest path.

     With `default` the web view is laid out below the status bar instead and
     runs to the physical bottom edge. The top does not move: the inset that
     was pushing the first line down (59) is replaced by the status bar iOS
     now draws in that same space, and --chrome-top reads 0 there and stops
     paying for it. The status bar is painted from the theme-color metas
     above, which are the paper in both schemes — so it does not seam. -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Digijournal">
<meta name="format-detection" content="telephone=no">

<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">

<!-- The two font files, ahead of the stylesheets that will ask for them:
     without this the first paint of a title is in the fallback face and
     visibly reflows when DM Sans lands. -->
<link rel="preload" href="fonts/dmsans-latin.woff2" as="font" type="font/woff2" crossorigin>

<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/app.css">
</head>

<body>
  <div id="app">
    <!-- Each screen mounts here. tabindex="-1" so focus can be moved to it on
         navigation without it becoming a tab stop of its own. -->
    <main class="screen" id="screen" tabindex="-1"></main>

    <header class="toolbar" id="toolbar" data-scrolled="false"></header>

    <nav class="bar" id="bar" aria-label="Write"></nav>
  </div>

  <!-- Toast copy is mirrored here so VoiceOver hears it. -->
  <div id="live" class="sr-only" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>

  <!-- Offline, and the update path: registers the worker, and reloads the app
       when a deploy has actually changed something. It flushes the open
       editor before it does, and waits if you are typing. See js/update.js. -->
  <script type="module" src="js/update.js"></script>
</body>
</html>
